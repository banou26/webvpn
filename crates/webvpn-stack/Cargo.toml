[package]
name = "webvpn-stack"
description = "A TCP/IP stack for the client's end of a WebVPN IP tunnel, on smoltcp, built to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
webvpn-proto = { path = "../webvpn-proto" }
# smoltcp's main branch with three fixes of its TCP socket that it does not have yet: back to a release once one
# carries them
[dependencies.smoltcp]
git = "https://github.com/banou26/smoltcp"
rev = "69afb290ee08f36f64036b66812c8ce2509ce756"
default-features = false
features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-udp",
]
