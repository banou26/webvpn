[package]
name = "webvpn-stack"
description = "A TCP/IP stack for the client's end of a WebVPN IP tunnel, on smoltcp, built to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
webvpn-proto = { path = "../webvpn-proto" }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-udp",
] }
