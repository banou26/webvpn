[package]
name = "webvpn-server"
description = "The WebVPN relay as a library: sessions, sockets and the policy a relay's operator plugs in"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
webvpn-proto = { path = "../webvpn-proto", version = "0.1.0" }
anyhow = "1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
socket2 = "0.5.7"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }
