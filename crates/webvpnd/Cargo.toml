[package]
name = "webvpnd"
description = "The WebVPN relay as a program: one relay on WebTransport and WebSocket, set up by environment variables"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["webvpn", "webtransport", "websocket", "relay", "proxy"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
webvpn-proto = { path = "../webvpn-proto", version = "0.1.0" }
webvpn-server = { path = "../webvpn-server", version = "0.1.0" }
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
rlimit = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
webvpn-server = { path = "../webvpn-server", version = "0.1.0", features = ["tun"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
